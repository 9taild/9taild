name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout repository
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # Create profile directory
      # --------------------------------
      - name: Create profile directory
        run: mkdir -p profile

      # --------------------------------
      # GitHub Statistics
      # --------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=Bhagyashri71&
            show_icons=true&
            include_all_commits=true&
            count_private=true&
            hide_border=true&
            theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Top Languages
      # --------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Bhagyashri71&
            layout=compact&
            langs_count=8&
            hide_border=true&
            theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # GitHub Trophies
      # --------------------------------
      - name: Generate Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: >-
            username=Bhagyashri71&
            theme=tokyonight&
            no-frame=true&
            margin-w=10&
            margin-h=10
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Commit generated files
      # --------------------------------
      - name: Commit generated files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git diff --cached --quiet || \
            git commit -m "Update GitHub profile statistics"

          git push
